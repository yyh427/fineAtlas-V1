[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fineatlas-tree"
version = "1.9.0rc1"
description = "Portable, read-only Python and CLI access to the FineAtlas classification graph"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = ["numpy", "scipy", "beautifulsoup4"]

[project.scripts]
fineatlas = "fineatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
