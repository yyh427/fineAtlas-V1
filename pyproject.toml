[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fineatlas-tree"
version = "1.3.1"
description = "Portable, read-only Python and CLI access to the complete FineAtlas classification graph"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fineatlas = "fineatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
